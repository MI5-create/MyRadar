name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ccache build-essential

    - name: Install Buildozer and dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install buildozer==1.5.0 virtualenv
        # 强制降级 Cython 和 setuptools，这是 Kivy 打包成功的关键
        pip3 install "cython==0.29.33" "setuptools<71.0.0"

    - name: Build with Buildozer
      run: |
        rm -rf .buildozer
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyRadar-APK
        path: bin/*.apk
