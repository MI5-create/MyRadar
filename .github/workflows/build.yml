name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 直接使用 Kivy 官方提供的 Docker 镜像，里面包含所有完美配置的编译环境
    - name: Build with Buildozer in Docker
      uses: addnab/docker-run-action@v3
      with:
        image: kivy/buildozer:latest
        options: -v ${{ github.workspace }}:/home/user/hostcwd
        run: |
          cd /home/user/hostcwd
          # 每次清理，防止旧错误残留
          rm -rf .buildozer
          # 直接编译
          buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyRadar-APK
        path: bin/*.apk
