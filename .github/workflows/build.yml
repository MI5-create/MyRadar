name: Build APK

on: [push, workflow_dispatch]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Buildozer
      run: |
        python3 -m pip install --upgrade pip
        pip3 install buildozer virtualenv
        # 再次强锁 Cython，绝不妥协
        pip3 install "cython==0.29.36" "setuptools<71.0.0"

    - name: Build APK
      run: |
        rm -rf .buildozer
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyRadar-APK
        path: bin/*.apk
