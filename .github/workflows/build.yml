name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf automake libtool \
            pkg-config \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5 \
            libncursesw5 \
            libtinfo5 \
            ccache \
            build-essential

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;33.0.0" >/dev/null 2>&1 || true

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          pip3 install buildozer==1.5.0 virtualenv
          pip3 install "cython==0.29.36" "setuptools<71.0.0"

      - name: Pre-download Android SDK
        run: |
          sdkmanager "platforms;android-31" >/dev/null 2>&1 || true

      - name: Build with Buildozer
        env:
          CFLAGS: ${{ env.CFLAGS }} -Wno-deprecated -Wno-deprecated-declarations
          CXXFLAGS: ${{ env.CXXFLAGS }} -Wno-deprecated -Wno-deprecated-declarations
          P4A_VERBOSE: '1'
        run: |
          rm -rf .buildozer
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyRadar-APK
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Build Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Build-Logs
          path: |
            .buildozer/android/platform/build-*/dists/*/build.log
          retention-days: 7
