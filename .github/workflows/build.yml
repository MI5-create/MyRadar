name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 使用官方 Docker 镜像进行纯净打包
    - name: Build with Buildozer in Docker
      run: |
        echo "=== 1. 正在拉取官方 Kivy 打包镜像 ==="
        docker pull kivy/buildozer:latest
        
        echo "=== 2. 开始编译 APK ==="
        # 关键修复：使用 --entrypoint /bin/bash 覆盖默认入口，用 -w 指定工作目录
        docker run --rm \
          -v ${{ github.workspace }}:/home/user/hostcwd \
          -w /home/user/hostcwd \
          --entrypoint /bin/bash \
          kivy/buildozer:latest \
          -c "rm -rf .buildozer && buildozer -v android debug"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyRadar-APK
        path: bin/*.apk
