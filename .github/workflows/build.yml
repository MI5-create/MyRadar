name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Buildozer global components
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build with Buildozer in Docker
        run: |
          docker run --rm -u root \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            -v $HOME/.buildozer:/root/.buildozer \
            -w /home/user/hostcwd \
            --entrypoint /bin/bash \
            kivy/buildozer:latest \
            -c "export MAKEFLAGS='-j1' && rm -rf .buildozer && buildozer -v android debug"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyRadar-APK
          path: bin/*.apk
