name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 补全所有底层编译可能缺失的 C 语言依赖库（automake, libltdl-dev）
    - name: Install System Dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool
      # 强制在服务器端接受 Android SDK 许可证
      echo "y" | sudo tee /dev/null | sudo android update sdk --no-ui --filter tools,platform-tools,android-33 --force

    # 直接安装，不使用缓存，保证环境绝对干净
    - name: Install Buildozer
      run: |
        python3 -m pip install --upgrade pip
        # 锁定 buildozer 版本
        pip3 install buildozer==1.5.0 virtualenv
        # 强行降级 Cython 和 setuptools，避免底层编译报错！
        pip3 install "cython==0.29.36" "setuptools<71.0.0"

        # 开始打包
        - name: Build with Buildozer
          run: |
            # 每次打包前，清理掉可能残留的旧编译文件
            rm -rf .buildozer
            export CFLAGS="${CFLAGS} -Wno-deprecated -Wno-deprecated-declarations"
            export CXXFLAGS="${CXXFLAGS} -Wno-deprecated -Wno-deprecated-declarations"
            buildozer -v android debug


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyRadar-APK
        path: bin/*.apk
